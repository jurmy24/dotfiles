# Starship prompt — Catppuccin Mocha, matching the Ghostty + GRUB theme.
# Docs: https://starship.rs/config  |  Requires a Nerd Font (JetBrainsMono NF).

"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = "$jobs$time"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[python]
symbol = " "
style = "yellow"
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = "󱘗 "
style = "red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "sapphire"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "sapphire"
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "took [$duration]($style) "

[jobs]
symbol = "󰒲 "
style = "peach"
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "overlay0"
format = "[$time]($style)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
